info:
  name: Call endpoint variable
  type: http
  seq: 1

http:
  method: GET
  url: "{{endpoint}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.message
      operator: eq
      value: Simple Grocery Store API.
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

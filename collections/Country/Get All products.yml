info:
  name: Get All products
  type: http
  seq: 3

http:
  method: GET
  url: "{{endpoint}}/products"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        bru.setEnvVar("productId", data[0].id);
        bru.setEnvVar("newProductId", data[1].id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

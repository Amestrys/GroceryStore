info:
  name: Get a single order
  type: http
  seq: 12

http:
  method: GET
  url: "{{endpoint}}/orders/:orderId"
  params:
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

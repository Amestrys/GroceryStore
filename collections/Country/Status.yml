info:
  name: Status
  type: http
  seq: 2

http:
  method: GET
  url: "{{endpoint}}/status"
  auth: inherit

runtime:
  assertions:
    - expression: res.body.status
      operator: eq
      value: UP
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

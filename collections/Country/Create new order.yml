info:
  name: Create new order
  type: http
  seq: 11

http:
  method: POST
  url: "{{endpoint}}/orders"
  body:
    type: json
    data: |-
      {
          "cartId": "{{cartId}}",
          "customerName": "DoeReaMie"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()

        bru.setEnvVar("orderId", data.orderId)
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

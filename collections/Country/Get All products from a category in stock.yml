info:
  name: Get All products from a category in stock
  type: http
  seq: 4

http:
  method: GET
  url: "{{endpoint}}/products?category=meat-seafood&available=true&results=2"
  params:
    - name: category
      value: meat-seafood
      type: query
    - name: available
      value: "true"
      type: query
    - name: results
      value: "2"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
